
name: Gerar CZZIN TRICK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CZZIN_TRICK_Projeto_Android.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto
        run: |
          unzip CZZIN_TRICK_Projeto_Android.zip -d projeto

      - name: Compilar APK
        run: gradle -p projeto assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CZZIN-TRICK-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
